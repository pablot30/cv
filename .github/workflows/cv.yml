name: CV

# Builds the PDF, checks it is one page, and publishes the CV on GitHub Pages.
# Once a week it also copies open-conqueror's progress summary into the CV,
# so the side-project line stays current without manual edits.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Liberation Sans (same metrics as Arial)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Sync the open-conqueror progress summary
        run: python3 scripts/cv.py sync

      - name: Build the PDF and check it is one page
        run: python3 scripts/cv.py build

      - name: Commit the updated summary
        run: |
          if git diff --quiet -- index.html; then
            echo "No summary change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Pablo-Torres-CV.pdf
          git commit -m "Update open-conqueror progress from its summary"
          git push

      - name: Stage the site
        run: |
          mkdir _site
          cp index.html Pablo-Torres-CV.pdf _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
