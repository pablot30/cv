name: CV

# Builds the PDF, checks it is one page, and publishes the CV on GitHub Pages.
# Once a week it also copies open-conqueror's progress summary into the CV,
# so the side-project line stays current without manual edits.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Liberation Sans (same metrics as Arial)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Sync the open-conqueror progress summary
        run: python3 scripts/cv.py sync

      - name: Build the PDF and check it is one page
        run: python3 scripts/cv.py build

      - name: Commit the updated summary
        run: |
          if git diff --quiet -- index.html; then
            echo "No summary change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Pablo-Torres-CV.pdf
          git commit -m "Update open-conqueror progress from its summary"
          git push

      - name: Stage the site
        run: |
          mkdir _site
          cp index.html Pablo-Torres-CV.pdf _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
